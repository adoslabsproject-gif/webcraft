# Release pipeline — builds native installers for every desktop platform.
#
# Triggers:
#   - push of a tag `v*` (e.g. v0.1.0)  → builds + creates a DRAFT GitHub Release with all artifacts
#   - manual run (workflow_dispatch)     → builds only, artifacts attached to the workflow run
#
# Artifacts per platform:
#   - macOS  (aarch64 + x86_64): WebCraft.app + WebCraft_<ver>_<arch>.dmg
#   - Windows (x86_64):          WebCraft_<ver>_x64-setup.exe (NSIS) + WebCraft_<ver>_x64_en-US.msi
#   - Linux  (x86_64):           .AppImage + .deb + .rpm

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: '--target x86_64-apple-darwin'
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ''
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            # AppImage only: it embeds the sherpa/onnxruntime .so files via
            # linuxdeploy; deb/rpm would ship without them → broken voice.
            args: '--bundles appimage'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            libssl-dev \
            libasound2-dev

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # version is read from the "packageManager" field in package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: ${{ matrix.target }}

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # ── Voice (sherpa-onnx) native libraries ─────────────────────────────
      # The shared libs only exist AFTER the first cargo build, but the
      # platform bundle configs (tauri.macos.conf.json / tauri.windows.conf.
      # json) are validated BEFORE it. Two-phase dance: hide the platform
      # config, build once (produces the libs), stage them, restore the
      # config — the tauri-action build below then bundles them.

      - name: MSVC dev environment (for cargs.lib)
        if: matrix.platform == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build cargs.lib (C dep missing from the sherpa-onnx shared package)
        if: matrix.platform == 'windows-latest'
        shell: cmd
        run: |
          if not exist apps\desktop\src-tauri\cargs-lib mkdir apps\desktop\src-tauri\cargs-lib
          curl -L -o cargs.c https://raw.githubusercontent.com/likle/cargs/master/src/cargs.c
          curl -L -o cargs.h https://raw.githubusercontent.com/likle/cargs/master/include/cargs.h
          cl /nologo /c /I. cargs.c
          lib /nologo /OUT:apps\desktop\src-tauri\cargs-lib\cargs.lib cargs.obj

      - name: Pre-build voice libs (macOS two-phase)
        if: matrix.platform == 'macos-latest'
        working-directory: apps/desktop
        run: |
          # A restored rust-cache skips the sherpa-rs-sys build script, but
          # its downloaded native package lives OUTSIDE the cache — force the
          # script to re-run so the libs are re-downloaded on fresh runners.
          cargo clean --manifest-path src-tauri/Cargo.toml -p sherpa-rs-sys
          mv src-tauri/tauri.macos.conf.json src-tauri/_mac.conf.bak
          pnpm tauri build ${{ matrix.args }} --no-bundle
          node scripts/copy-voice-libs.mjs
          mv src-tauri/_mac.conf.bak src-tauri/tauri.macos.conf.json

      - name: Pre-build voice libs (Linux two-phase)
        if: matrix.platform == 'ubuntu-22.04'
        working-directory: apps/desktop
        run: |
          # Phase 1: compiling makes sherpa-rs download its .so files into
          # ~/.cache/sherpa-rs. Phase 2 (tauri-action below) bundles with
          # that dir on LD_LIBRARY_PATH so ldd resolves the libs and
          # linuxdeploy embeds them into the AppImage. cargo clean forces the
          # sherpa-rs-sys build script to re-run (its download cache is not
          # part of rust-cache).
          cargo clean --manifest-path src-tauri/Cargo.toml -p sherpa-rs-sys
          pnpm tauri build --no-bundle
          SHERPA_SO=$(find ~/.cache/sherpa-rs src-tauri/target -name 'libsherpa-onnx-c-api.so' 2>/dev/null | head -1)
          if [ -z "$SHERPA_SO" ]; then echo "::error::libsherpa-onnx-c-api.so not found after build"; exit 1; fi
          SHERPA_LIB_DIR=$(dirname "$SHERPA_SO")
          echo "LD_LIBRARY_PATH=$SHERPA_LIB_DIR:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
          echo "voice .so dir: $SHERPA_LIB_DIR"

      - name: Pre-build voice libs (Windows two-phase)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        working-directory: apps/desktop
        run: |
          # Force sherpa-rs-sys to re-download its native package (see the
          # macOS step) — with a restored rust-cache the .lib/.dll files are
          # otherwise missing on the fresh runner (LNK1181).
          cargo clean --manifest-path src-tauri/Cargo.toml -p sherpa-rs-sys
          Move-Item src-tauri/tauri.windows.conf.json src-tauri/_win.conf.bak -Force
          pnpm tauri build --no-bundle
          node scripts/copy-voice-libs.mjs
          Move-Item src-tauri/_win.conf.bak src-tauri/tauri.windows.conf.json -Force

      - name: Build and bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS code-signing + notarization: once an Apple Developer
          # certificate exists, add the repo secrets APPLE_CERTIFICATE,
          # APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY, APPLE_ID,
          # APPLE_PASSWORD, APPLE_TEAM_ID and re-add them here as env vars.
          # NOTE: do NOT reference the secrets before they exist — empty
          # values make tauri-action attempt a codesign with a blank
          # certificate and the macOS build fails.
        with:
          projectPath: apps/desktop
          args: ${{ matrix.args }}
          # On tag push: create/update a draft release with all installers attached.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('WebCraft {0}', github.ref_name) || '' }}
          releaseDraft: true
          prerelease: false

      - name: Verify AppImage embeds the voice libraries
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          APPIMAGE=$(find apps/desktop/src-tauri/target -name '*.AppImage' | head -1)
          if [ -z "$APPIMAGE" ]; then echo "::error::AppImage not produced"; exit 1; fi
          chmod +x "$APPIMAGE"
          "$APPIMAGE" --appimage-extract >/dev/null
          if ! find squashfs-root -name 'libsherpa-onnx-c-api.so' | grep -q .; then
            echo "::error::voice .so files missing from the AppImage — it would crash at launch"
            exit 1
          fi
          echo "AppImage contains the sherpa/onnxruntime libraries."

      - name: Upload artifacts (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: webcraft-${{ matrix.target }}
          path: |
            apps/desktop/src-tauri/target/**/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/**/release/bundle/macos/*.app/**
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: warn
