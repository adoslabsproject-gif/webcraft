[package]
name = "webcraft"
version = "0.1.0"
description = "WebCraft — the most advanced AI IDE ever made"
authors = ["Nicola Cucurachi <ados.labsproject@gmail.com>"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "webcraft_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# PTY for the integrated terminal — cross-platform (Unix + Windows ConPTY)
portable-pty = "0.9"
# Voice dictation — local whisper STT (sherpa-onnx) + native mic capture.
# Same stack as the Liara app; model downloaded on-demand from GitHub.
sherpa-rs = { version = "0.6", features = ["download-binaries"] }
cpal = "0.15"
# OS keychain for API keys (macOS Keychain / Windows Credential Manager /
# Linux Secret Service) — replaces plaintext settings.json storage.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
# STT model download: blocking HTTP + sha256 verify + zip extract (deflate
# only — no bzip2/zstd native deps).
ureq = "2"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
# Async runtime for the PTY reader threads / channels
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread", "io-util", "macros"] }
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"] }

[features]
# this feature is used for production builds or when `devUrl` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
